<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NEON ARCADE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;background:#05050f;color:#e0e0ff;font-family:'Segoe UI',system-ui,sans-serif}
body{min-height:100vh;position:relative}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.blob{position:fixed;border-radius:50%;filter:blur(120px);opacity:.35;z-index:0;pointer-events:none;animation:bm 30s infinite ease-in-out alternate}
.b1{width:600px;height:600px;background:var(--c1,#ff006e);top:-200px;left:-200px}
.b2{width:700px;height:700px;background:var(--c2,#00f2fe);bottom:-250px;right:-250px;animation-delay:-10s}
.b3{width:500px;height:500px;background:var(--c3,#8338ec);top:40%;left:50%;animation-delay:-20s}
@keyframes bm{0%{transform:translate(0,0) scale(1)}50%{transform:translate(150px,-80px) scale(1.2)}100%{transform:translate(-100px,100px) scale(.9)}}
.screen{position:relative;z-index:1;padding:15px;display:none;opacity:0;transform:translateY(30px);transition:opacity .5s,transform .5s}
.screen.on{display:block;opacity:1;transform:translateY(0);animation:screenIn .5s}
.screen.exit{opacity:0;transform:translateY(-30px)}
@keyframes screenIn{from{opacity:0;transform:translateY(40px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.profile-bar{position:fixed;top:10px;right:10px;z-index:100;display:flex;align-items:center;gap:8px;background:rgba(10,10,30,.95);border:1px solid rgba(0,242,254,.4);border-radius:50px;padding:5px 14px 5px 5px;backdrop-filter:blur(15px);cursor:pointer;transition:all .3s;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.profile-bar:hover{border-color:#00f2fe;box-shadow:0 0 25px rgba(0,242,254,.5);transform:translateY(-2px)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ff006e,#8338ec);display:flex;align-items:center;justify-content:center;font-size:1em;font-weight:bold;color:#fff;border:2px solid #00f2fe;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-info{display:flex;flex-direction:column;min-width:0}
.profile-name{font-size:.8em;font-weight:bold;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-level{font-size:.65em;color:#00f2fe}
.profile-xp-bar{width:70px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:2px;overflow:hidden}
.profile-xp-fill{height:100%;background:linear-gradient(90deg,#00f2fe,#8338ec);transition:width .5s}
.sync-indicator{position:fixed;top:10px;left:10px;z-index:100;padding:6px 12px;background:rgba(10,10,30,.9);border:1px solid rgba(6,255,165,.4);border-radius:20px;font-size:.75em;color:#06ffa5;backdrop-filter:blur(10px);display:flex;align-items:center;gap:6px;cursor:pointer}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#06ffa5;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(15px);z-index:1000;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;padding:15px}
.modal-overlay.on{display:flex;opacity:1}
.modal{background:linear-gradient(135deg,#0f0f2e,#1a1a3e);border:2px solid #4facfe;border-radius:20px;padding:25px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;text-align:center;transform:scale(.7);transition:transform .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 20px 60px rgba(0,0,0,.8)}
.modal-overlay.on .modal{transform:scale(1)}
.modal h3{font-size:1.8em;margin-bottom:12px;background:linear-gradient(90deg,#00f2fe,#ff006e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal p{font-size:1em;color:#ccc;margin-bottom:15px;line-height:1.5}
.modal-btn{padding:12px 30px;background:linear-gradient(135deg,#4facfe,#00f2fe);border:none;color:#fff;border-radius:25px;cursor:pointer;font-size:1em;font-weight:bold;transition:all .3s;box-shadow:0 6px 20px rgba(0,242,254,.4);margin:4px}
.modal-btn:hover{transform:scale(1.05)}
.modal-btn.s{background:linear-gradient(135deg,#ff006e,#8338ec)}
.modal-btn.ghost{background:transparent;border:2px solid #4facfe}
.profile-modal{display:flex;flex-direction:column;gap:15px}
.profile-header{display:flex;align-items:center;gap:15px;padding:15px;background:rgba(0,0,0,.3);border-radius:15px;border:1px solid rgba(0,242,254,.2)}
.profile-avatar-big{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#ff006e,#8338ec);display:flex;align-items:center;justify-content:center;font-size:2em;font-weight:bold;color:#fff;border:3px solid #00f2fe;flex-shrink:0;overflow:hidden;cursor:pointer}
.profile-avatar-big img{width:100%;height:100%;object-fit:cover}
.profile-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.profile-stat{background:rgba(0,0,0,.3);padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.1)}
.profile-stat-n{font-size:1.3em;font-weight:bold;color:#00f2fe}
.profile-stat-l{font-size:.75em;color:#aaa}
.auth-section{padding:15px;background:rgba(0,0,0,.3);border-radius:12px;border:1px dashed rgba(255,255,255,.2)}
.auth-section h4{margin-bottom:8px;color:#ffbe0b;font-size:1em}
.auth-tabs{display:flex;gap:5px;margin-bottom:12px}
.auth-tab{flex:1;padding:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:15px;cursor:pointer;font-size:.85em}
.auth-tab.active{background:#4facfe;border-color:#4facfe}
.auth-form{display:flex;flex-direction:column;gap:8px}
.auth-input{padding:10px 14px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);border-radius:12px;color:#fff;font-size:.95em;outline:none}
.auth-input:focus{border-color:#00f2fe}
.google-btn{width:100%;padding:12px;background:#fff;color:#333;border:none;border-radius:20px;cursor:pointer;font-weight:bold;display:flex;align-items:center;justify-content:center;gap:10px;font-size:.95em}
.logout-btn{width:100%;padding:10px;background:transparent;color:#ff006e;border:2px solid #ff006e;border-radius:20px;cursor:pointer;font-weight:bold;font-size:.9em;margin-top:8px}
.divider{display:flex;align-items:center;gap:10px;margin:10px 0;color:#888;font-size:.85em}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.2)}
.avatar-picker{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0;max-height:200px;overflow-y:auto}
.avatar-opt{width:45px;height:45px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3em;cursor:pointer;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05)}
.avatar-opt:hover{transform:scale(1.15);border-color:#00f2fe}
.avatar-opt.selected{border-color:#00f2fe;box-shadow:0 0 15px rgba(0,242,254,.5)}
#title{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100vh;padding:15px}
#title.on{display:flex}
.logo{font-size:clamp(3em,10vw,5.5em);font-weight:900;letter-spacing:6px;background:linear-gradient(90deg,#ff006e,#00f2fe,#8338ec,#ffbe0b,#ff006e);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:sh 4s linear infinite,fl 3s ease-in-out infinite;margin-bottom:10px}
.sub{font-size:1.1em;color:#aaa;margin-bottom:40px;letter-spacing:3px}
@keyframes sh{to{background-position:300% center}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.btn-ripple{position:relative;overflow:hidden;transition:all .3s}
.btn-ripple:active{transform:scale(.95)}
.play{padding:22px 70px;font-size:1.8em;font-weight:bold;letter-spacing:5px;color:#fff;background:linear-gradient(135deg,#ff006e,#8338ec);border:none;border-radius:50px;cursor:pointer;box-shadow:0 12px 40px rgba(255,0,110,.6);animation:pb 2.5s infinite}
@keyframes pb{0%,100%{box-shadow:0 12px 40px rgba(255,0,110,.6)}50%{box-shadow:0 12px 50px rgba(255,0,110,.9),0 0 80px rgba(131,56,236,.5)}}
.stats-row{margin-top:35px;display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.stat{text-align:center;padding:15px 22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:15px}
.stat-n{font-size:2em;font-weight:bold;color:#00f2fe}
.stat-l{font-size:.8em;color:#aaa;margin-top:5px}
.mh{text-align:center;margin-bottom:20px}
.mh h2{font-size:2.2em;background:linear-gradient(90deg,#00f2fe,#ff006e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.mh p{color:#888;font-size:.95em}
.menu-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;max-width:700px;margin:0 auto 20px}
.menu-info-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:15px;padding:15px;text-align:center}
.menu-info-card .mic{font-size:2em;margin-bottom:5px}
.menu-info-card .min{font-size:1.3em;font-weight:bold;color:#00f2fe}
.menu-info-card .mil{font-size:.75em;color:#aaa}
.ma{display:flex;justify-content:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.ab{padding:10px 25px;background:rgba(255,255,255,.08);border:2px solid #00f2fe;color:#fff;border-radius:30px;cursor:pointer;font-size:.95em;font-weight:600}
.ab:hover{background:#00f2fe;color:#05050f}
.ab.r{border-color:#ff006e}.ab.r:hover{background:#ff006e}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px;max-width:1100px;margin:0 auto;padding-bottom:30px}
.gc{position:relative;aspect-ratio:1;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);border-radius:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px;text-align:center}
.gc:hover{border-color:var(--c1,#ff006e);transform:translateY(-8px)}
.gc>*{position:relative;z-index:1}
.gi{font-size:3em;margin-bottom:8px}
.gn{font-size:1em;font-weight:bold;margin-bottom:4px}
.gd{font-size:.75em;color:#aaa}
.gs{max-width:720px;margin:0 auto}
.gt{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px}
.bb{padding:9px 18px;background:rgba(255,255,255,.08);border:2px solid #ff006e;color:#fff;border-radius:25px;cursor:pointer;font-size:.9em;font-weight:600}
.bb:hover{background:#ff006e}
.gtt{font-size:1.4em;background:linear-gradient(90deg,#00f2fe,#ff006e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:bold}
.stats-btn{padding:7px 15px;background:rgba(255,255,255,.08);border:2px solid #ffbe0b;color:#fff;border-radius:25px;cursor:pointer;font-size:.8em;font-weight:600}
.gc2{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:20px;text-align:center}
canvas.gc{background:#0a0a1e;border:2px solid #4facfe;border-radius:12px;max-width:100%;touch-action:none;display:block;margin:0 auto}
.gi2{display:flex;justify-content:space-around;margin:12px 0;font-size:1.05em;flex-wrap:wrap;gap:10px}
.gi2 span.v{color:#00f2fe;font-weight:bold}
.gb{padding:9px 22px;background:linear-gradient(135deg,#4facfe,#00f2fe);border:none;color:#fff;border-radius:22px;cursor:pointer;margin:4px;font-size:.9em;font-weight:bold}
.gb.s{background:linear-gradient(135deg,#ff006e,#8338ec)}
.gh{margin-top:12px;font-size:.8em;color:#888}
.tutorial{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(200px);background:rgba(10,10,30,.95);border:2px solid #00f2fe;border-radius:15px;padding:15px 25px;max-width:90%;z-index:999;opacity:0;transition:all .5s}
.tutorial.on{transform:translateX(-50%) translateY(0);opacity:1}
.tutorial-icon{font-size:1.8em;margin-bottom:6px}
.tutorial-text{font-size:.9em;color:#fff}
.tutorial-close{position:absolute;top:6px;right:10px;background:none;border:none;color:#fff;font-size:1.3em;cursor:pointer}
.cf{position:fixed;width:10px;height:10px;pointer-events:none;z-index:1001;animation:cf 2.5s ease-in forwards}
@keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.dp{display:none;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:6px;justify-content:center;margin:15px auto}
.dp button{background:rgba(79,172,254,.2);border:2px solid #4facfe;color:#fff;border-radius:12px;font-size:1.6em;cursor:pointer}
.dp .u{grid-column:2;grid-row:1}.dp .l{grid-column:1;grid-row:2}.dp .r{grid-column:3;grid-row:2}.dp .d{grid-column:2;grid-row:3}
.tw{position:relative;display:inline-block}
.tb{display:grid;grid-template-columns:repeat(3,80px);gap:6px;justify-content:center;margin:15px auto}
.tc{width:80px;height:80px;background:rgba(255,255,255,.05);border:2px solid #4facfe;border-radius:10px;font-size:2.5em;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tc.x{color:#00f2fe;text-shadow:0 0 15px #00f2fe}
.tc.o{color:#ff6b9d;text-shadow:0 0 15px #ff6b9d}
.tc.w{background:rgba(255,215,0,.3);box-shadow:0 0 25px #ffd700}
.ts{position:absolute;inset:0;pointer-events:none}
.ts line{stroke:#ffd700;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 8px #ffd700);stroke-dasharray:500;stroke-dashoffset:500;animation:dl .6s forwards}
.mt{display:flex;justify-content:center;gap:8px;margin:12px 0;flex-wrap:wrap}
.mt button{padding:7px 14px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.2);color:#fff;border-radius:20px;cursor:pointer;font-size:.8em;font-weight:600}
.mt button.on{background:#4facfe;border-color:#4facfe}
.st{font-size:1.1em;margin:8px 0;min-height:25px;font-weight:600}
@keyframes dl{to{stroke-dashoffset:0}}
@keyframes sk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.g2048{display:grid;grid-template-columns:repeat(4,65px);gap:6px;background:rgba(0,0,0,.3);padding:8px;border-radius:12px;justify-content:center;margin:15px auto;width:fit-content}
.g2048 div{width:65px;height:65px;background:rgba(255,255,255,.05);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.3em;font-weight:bold}
.mb{display:grid;grid-template-columns:repeat(4,65px);gap:6px;justify-content:center;margin:15px auto}
.mc{width:65px;height:65px;background:linear-gradient(135deg,#4facfe,#00f2fe);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.8em}
.mc.f{background:rgba(255,255,255,.1)}
.mc.m{background:linear-gradient(135deg,#06ffa5,#00f2fe)}
.sb{display:grid;grid-template-columns:repeat(2,100px);gap:10px;justify-content:center;margin:15px auto}
.sb div{width:100px;height:100px;border-radius:12px;cursor:pointer;opacity:.5;border:3px solid rgba(255,255,255,.1)}
.sb div.on{opacity:1;transform:scale(1.08);box-shadow:0 0 35px currentColor}
.sb .r{background:#ff006e;color:#ff006e}.sb .g{background:#06ffa5;color:#06ffa5}.sb .b{background:#4facfe;color:#4facfe}.sb .y{background:#ffbe0b;color:#ffbe0b}
.wh{display:grid;grid-template-columns:repeat(3,80px);gap:8px;justify-content:center;margin:15px auto}
.wh div{width:80px;height:80px;background:radial-gradient(circle,#3a2a1a,#1a1a0a);border-radius:50%;cursor:pointer;position:relative;overflow:hidden;border:3px solid #5a4a3a}
.wh div .mo{position:absolute;bottom:-100%;left:50%;transform:translateX(-50%);font-size:2.5em;transition:bottom .2s}
.wh div.on .mo{bottom:12%}
.rp{display:flex;justify-content:center;gap:15px;margin:15px 0}
.rp div{width:75px;height:75px;background:rgba(255,255,255,.05);border:2px solid #4facfe;border-radius:50%;font-size:2.5em;cursor:pointer;display:flex;align-items:center;justify-content:center}
.rr{display:flex;justify-content:space-around;align-items:center;margin:15px 0;font-size:2.5em}
.rr div{padding:12px;background:rgba(255,255,255,.05);border-radius:12px;min-width:90px}
.aa{position:relative;width:100%;max-width:350px;height:350px;background:rgba(0,0,0,.3);border:2px solid #4facfe;border-radius:12px;margin:15px auto;overflow:hidden;cursor:crosshair}
.at{position:absolute;width:45px;height:45px;border-radius:50%;background:radial-gradient(circle,#ff006e,#8338ec);box-shadow:0 0 20px #ff006e;cursor:pointer}
.cw{font-size:2.2em;font-weight:bold;margin:12px 0;min-height:60px}
.co{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.co div{padding:10px 18px;border-radius:12px;cursor:pointer;font-weight:bold;color:#fff}
.rx{width:100%;max-width:350px;height:240px;margin:15px auto;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:1.3em;font-weight:bold;cursor:pointer}
.ms{display:grid;gap:2px;justify-content:center;margin:15px auto;width:fit-content}
.ms div{width:30px;height:30px;background:rgba(79,172,254,.3);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:bold;font-size:.85em;border-radius:4px}
.ms div.o{background:rgba(0,0,0,.3);cursor:default}
.ms div.f{background:rgba(255,190,11,.3)}
.ms div.m{background:#ff006e}
.hang-word{font-size:2em;letter-spacing:6px;margin:12px 0;font-weight:bold;color:#00f2fe}
.hang-letters{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:12px 0}
.hang-letters button{width:36px;height:36px;background:rgba(255,255,255,.1);border:2px solid #4facfe;color:#fff;border-radius:8px;cursor:pointer;font-weight:bold;font-size:.9em}
.hang-letters button.wrong{background:#ff006e;border-color:#ff006e}
.hang-letters button.right{background:#06ffa5;border-color:#06ffa5;color:#000}
.guess-input{padding:10px;font-size:1.2em;background:rgba(0,0,0,.3);border:2px solid #4facfe;color:#fff;border-radius:10px;text-align:center;width:120px;margin:8px}
.guess-hint{font-size:1.1em;margin:8px 0;color:#ffbe0b;min-height:30px}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:15px 0}
.setting-card{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:15px;padding:15px}
.setting-card h5{color:#00f2fe;margin-bottom:8px;font-size:.95em}
.setting-card label{display:flex;align-items:center;gap:8px;color:#aaa;font-size:.85em;cursor:pointer}
.setting-card select{width:100%;padding:6px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#fff}
.theme-options{display:flex;gap:8px;flex-wrap:wrap}
.theme-opt{width:40px;height:40px;border-radius:10px;cursor:pointer;border:2px solid rgba(255,255,255,.2)}
.theme-opt.selected{border-color:#00f2fe;transform:scale(1.1)}
.multiplayer-placeholder{text-align:center;padding:30px 20px}
.multiplayer-placeholder .mp-icon{font-size:4em;margin-bottom:15px}
.multiplayer-placeholder h4{font-size:1.5em;color:#ffbe0b;margin-bottom:10px}
.multiplayer-features{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:15px}
.mp-feature{background:rgba(255,255,255,.05);padding:10px;border-radius:10px;font-size:.85em;color:#888}
.mp-feature .mfi{font-size:1.5em;margin-bottom:5px}
@media(max-width:600px){
.dp{display:grid}
.profile-bar{top:8px;right:8px;padding:4px 10px 4px 4px;gap:6px}
.profile-info{display:none}
.avatar{width:30px;height:30px}
.gg{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gi{font-size:2.5em}
.logo{letter-spacing:3px}
.mh h2{font-size:1.8em}
.play{padding:18px 55px;font-size:1.5em}
}
body.no-anim-transitions .screen{transition:none!important;animation:none!important}
body.no-anim-cards .gc:hover{transform:none!important}
body.no-anim-confetti .cf{display:none!important}
body.no-anim-blobs .blob{animation:none!important}
body.no-anim-logo .logo{animation:none!important}
body.no-anim-play .play{animation:none!important}
body.no-anim-pulse .sync-dot{animation:none!important}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="sync-indicator" id="syncInd" onclick="window.showSettings()"><div class="sync-dot"></div><span id="syncText">💾 Локально</span></div>
<div class="profile-bar" onclick="window.showProfile()">
<div class="avatar" id="pAvatar">Г</div>
<div class="profile-info">
<div class="profile-name" id="pName">Гость</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
(function(){
'use strict';

const firebaseConfig = {
  apiKey: "AIzaSyAL7HZLqk4vxgb-1F_UUUpy5bH7174dfMw",
  authDomain: "neon-arcade-57b46.firebaseapp.com",
  projectId: "neon-arcade-57b46",
  storageBucket: "neon-arcade-57b46.firebasestorage.app",
  messagingSenderId: "550252728845",
  appId: "1:550252728845:web:50225274eb65f6aa087b44",
  measurementId: "G-SRWKK80M2Y"
};

let db=null,auth=null,currentUser=null,useFirebase=false,unsubscribe=null;
let localProfile=JSON.parse(localStorage.getItem('profile')||'{"name":"Гость","xp":0,"level":1,"gamesPlayed":0,"wins":0,"losses":0,"totalScore":0,"bestStreak":0,"timePlayed":0,"achievements":[],"joined":'+Date.now()+',"avatar":"Г","avatarType":"letter"}');
let localStats={};
let settings=JSON.parse(localStorage.getItem('settings')||'{"lang":"ru","theme":"neon","particles":true,"sound":false,"animTransitions":true,"animCards":true,"animButtons":true,"animModals":true,"animTutorials":true,"animConfetti":true,"animBlobs":true,"animLogo":true,"animPlay":true,"animPulse":true}');

const THEMES={
  neon:{c1:'#ff006e',c2:'#00f2fe',c3:'#8338ec',bg:'#05050f'},
  sunset:{c1:'#ff6b35',c2:'#f7c59f',c3:'#efefd0',bg:'#1a0f0a'},
  forest:{c1:'#06ffa5',c2:'#00b894',c3:'#55efc4',bg:'#0a1a0f'},
  galaxy:{c1:'#a29bfe',c2:'#6c5ce7',c3:'#fd79a8',bg:'#0f0a1a'},
  fire:{c1:'#ff006e',c2:'#ffbe0b',c3:'#ff6b35',bg:'#1a0a05'}
};

function applyTheme(){
  const t=THEMES[settings.theme]||THEMES.neon;
  document.documentElement.style.setProperty('--c1',t.c1);
  document.documentElement.style.setProperty('--c2',t.c2);
  document.documentElement.style.setProperty('--c3',t.c3);
  document.body.style.background=t.bg;
}

function applyAnimations(){
  const checks=[
    ['no-anim-transitions',!settings.animTransitions],
    ['no-anim-cards',!settings.animCards],
    ['no-anim-confetti',!settings.animConfetti],
    ['no-anim-blobs',!settings.animBlobs],
    ['no-anim-logo',!settings.animLogo],
    ['no-anim-play',!settings.animPlay],
    ['no-anim-pulse',!settings.animPulse]
  ];
  checks.forEach(([cls,add])=>{
    if(add)document.body.classList.add(cls);
    else document.body.classList.remove(cls);
  });
}

try{
  const app=firebase.initializeApp(firebaseConfig);
  auth=firebase.auth();
  db=firebase.firestore();
  useFirebase=true;
  document.getElementById('syncText').textContent='☁️ Облако';
}catch(e){console.log('Firebase не инициализирован:',e.message)}

window.googleSignIn=function(){
  if(!useFirebase){alert('Firebase не настроен');return}
  const p=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(p).catch(e=>{
    if(e.code==='auth/cancelled-popup-request'||e.code==='auth/popup-blocked')auth.signInWithRedirect(p);
    else alert('Ошибка: '+e.message);
  });
};

window.emailSignIn=function(email,password){
  if(!useFirebase){alert('Firebase не настроен');return}
  auth.signInWithEmailAndPassword(email,password).catch(e=>alert('Ошибка входа: '+e.message));
};

window.emailSignUp=function(email,password,name){
  if(!useFirebase){alert('Firebase не настроен');return}
  auth.createUserWithEmailAndPassword(email,password).then(cred=>{
    db.collection('users').doc(cred.user.uid).set({
      name:name||email.split('@')[0],photo:'',avatar:'👤',avatarType:'emoji',
      xp:localProfile.xp||0,level:localProfile.level||1,
      gamesPlayed:localProfile.gamesPlayed||0,wins:localProfile.wins||0,
      losses:localProfile.losses||0,totalScore:localProfile.totalScore||0,
      bestStreak:localProfile.bestStreak||0,timePlayed:localProfile.timePlayed||0,
      achievements:localProfile.achievements||[],joined:Date.now()
    });
  }).catch(e=>alert('Ошибка: '+e.message));
};

window.googleSignOut=function(){
  if(useFirebase){if(unsubscribe)unsubscribe();auth.signOut()}
};

if(useFirebase){
  auth.onAuthStateChanged(function(user){
    if(user){
      currentUser=user;
      if(unsubscribe)unsubscribe();
      const ref=db.collection('users').doc(user.uid);
      ref.get().then(function(snap){
        if(!snap.exists){
          ref.set({
            name:user.displayName||user.email.split('@')[0],
            photo:user.photoURL||'',
            avatar:user.photoURL?'img':'👤',
            avatarType:user.photoURL?'img':'emoji',
            xp:localProfile.xp||0,level:localProfile.level||1,
            gamesPlayed:localProfile.gamesPlayed||0,wins:localProfile.wins||0,
            losses:localProfile.losses||0,totalScore:localProfile.totalScore||0,
            bestStreak:localProfile.bestStreak||0,timePlayed:localProfile.timePlayed||0,
            achievements:localProfile.achievements||[],joined:localProfile.joined||Date.now()
          }).then(function(){return ref.get()});
        }
      }).then(function(snap){
        if(snap&&snap.exists){
          const data=snap.data();
          if(data.gameStats)localStats=data.gameStats;
          localProfile=Object.assign({},localProfile,data);
          updateProfileUI();
          updateMenuInfo();
        }
        unsubscribe=ref.onSnapshot(function(d){
          if(d.exists){
            const dt=d.data();
            if(dt.gameStats)localStats=dt.gameStats;
            localProfile=Object.assign({},localProfile,dt);
            updateProfileUI();
            updateMenuInfo();
          }
        });
      }).catch(function(e){console.error('Firestore err:',e)});
    }else{
      currentUser=null;
      if(unsubscribe){unsubscribe();unsubscribe=null}
      localProfile=JSON.parse(localStorage.getItem('profile')||'{"name":"Гость","xp":0,"level":1,"gamesPlayed":0,"wins":0,"losses":0,"totalScore":0,"bestStreak":0,"timePlayed":0,"achievements":[],"joined":'+Date.now()+',"avatar":"Г","avatarType":"letter"}');
      updateProfileUI();
      updateMenuInfo();
    }
  });
}

window.saveProfile=function(){
  if(useFirebase&&currentUser){
    db.collection('users').doc(currentUser.uid).update(localProfile).catch(function(){});
  }else{
    localStorage.setItem('profile',JSON.stringify(localProfile));
  }
};

function defaultStats(){return{played:0,wins:0,losses:0,bestScore:0,totalScore:0,avgScore:0,bestTime:0,worstTime:999999,totalTime:0,currentStreak:0,bestStreak:0,perfectGames:0,failedAttempts:0,accuracy:0,clicks:0,misses:0,levelsCompleted:0,highestLevel:0,itemsCollected:0,enemiesDefeated:0,damageTaken:0,healsUsed:0,powerupsUsed:0,secretsFound:0}}

window.getGameStats=function(id){
  if(useFirebase&&currentUser)return localStats[id]||defaultStats();
  return JSON.parse(localStorage.getItem('stats_'+id)||JSON.stringify(defaultStats()));
};

window.saveGameStats=function(id,stats){
  if(useFirebase&&currentUser){
    localStats[id]=stats;
    var upd={};upd['gameStats.'+id]=stats;
    db.collection('users').doc(currentUser.uid).update(upd).catch(function(){});
  }else{
    localStorage.setItem('stats_'+id,JSON.stringify(stats));
  }
};

window.updateGameStats=function(id,update){
  var stats=window.getGameStats(id);
  Object.keys(update).forEach(function(k){
    if(k==='bestScore')stats.bestScore=Math.max(stats.bestScore,update[k]);
    else if(k==='bestTime')stats.bestTime=update[k]<stats.bestTime?update[k]:stats.bestTime;
    else if(k==='worstTime')stats.worstTime=update[k]>stats.worstTime?update[k]:stats.worstTime;
    else if(k==='currentStreak'){stats.currentStreak=update[k];stats.bestStreak=Math.max(stats.bestStreak,update[k])}
    else if(typeof stats[k]==='number')stats[k]+=update[k];
  });
  stats.avgScore=stats.played?Math.round(stats.totalScore/stats.played):0;
  stats.accuracy=stats.clicks?Math.round(stats.clicks/(stats.clicks+stats.misses)*100):0;
  window.saveGameStats(id,stats);
};

function renderAvatar(container,profile,size){
  if(profile.avatarType==='img'&&profile.photo){container.innerHTML='<img src="'+profile.photo+'">'}
  else if(profile.avatarType==='emoji'){container.textContent=profile.avatar||'👤';container.style.fontSize=size?(parseInt(size)*0.6)+'px':'2em'}
  else{container.textContent=(profile.avatar||profile.name||'Г')[0].toUpperCase();container.style.fontSize=''}
}

function updateProfileUI(){
  document.getElementById('pName').textContent=localProfile.name;
  document.getElementById('pLevel').textContent='Уровень '+localProfile.level;
  var av=document.getElementById('pAvatar');
  renderAvatar(av,localProfile,'34px');
  var needed=localProfile.level*100;
  document.getElementById('pXpFill').style.width=Math.min(100,(localProfile.xp/needed*100))+'%';
  document.getElementById('totalGames').textContent=localProfile.gamesPlayed||0;
  document.getElementById('totalWins').textContent=localProfile.wins||0;
}

function updateMenuInfo(){
  document.getElementById('miGames').textContent=localProfile.gamesPlayed||0;
  document.getElementById('miWins').textContent=localProfile.wins||0;
  document.getElementById('miLevel').textContent=localProfile.level||1;
  document.getElementById('miStreak').textContent=localProfile.bestStreak||0;
}

window.addXP=function(amount){
  localProfile.xp+=amount;
  var needed=localProfile.level*100;
  if(localProfile.xp>=needed){localProfile.xp-=needed;localProfile.level++;window.showModal('🎉 Уровень '+localProfile.level+'!','Ты получил новый уровень!')}
  window.saveProfile();
  updateProfileUI();
  updateMenuInfo();
};

window.showProfile=function(){
  var modal=document.getElementById('modalContent');
  var isAuth=useFirebase&&currentUser;
  var avatarEmojis=['👤','🦊','🐱','🐶','🦁','🐸','🐵','🐼','🐨','🐯','🦄','🐲','👾','🤖','👻','💀','🎃','🦸','🧙','🥷'];
  var avatarLetters='АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЭЮЯ'.split('');
  var html='<div class="profile-modal">';
  html+='<h3>👤 Профиль</h3>';
  html+='<div class="profile-header"><div class="profile-avatar-big" id="bigAvatar" onclick="window.showAvatarPicker()"></div>';
  html+='<div style="text-align:left;flex:1"><div style="font-size:1.3em;font-weight:bold">'+localProfile.name+'</div>';
  html+='<div style="color:#00f2fe;font-size:.9em">Уровень '+localProfile.level+' · '+localProfile.xp+'/'+(localProfile.level*100)+' XP</div>';
  html+='<div style="font-size:.75em;color:#888;margin-top:4px">'+(isAuth?'☁️ '+currentUser.email:'💾 Гостевой режим')+' · С '+new Date(localProfile.joined).toLocaleDateString('ru')+'</div></div></div>';
  html+='<div class="profile-stats">';
  html+='<div class="profile-stat"><div class="profile-stat-n">'+(localProfile.gamesPlayed||0)+'</div><div class="profile-stat-l">Игр</div></div>';
  html+='<div class="profile-stat"><div class="profile-stat-n">'+(localProfile.wins||0)+'</div><div class="profile-stat-l">Побед</div></div>';
  html+='<div class="profile-stat"><div class="profile-stat-n">'+(localProfile.losses||0)+'</div><div class="profile-stat-l">Поражений</div></div>';
  html+='<div class="profile-stat"><div class="profile-stat-n">'+(localProfile.totalScore||0)+'</div><div class="profile-stat-l">Очков</div></div>';
  html+='<div class="profile-stat"><div class="profile-stat-n">'+(localProfile.bestStreak||0)+'</div><div class="profile-stat-l">Серия</div></div>';
  html+='<div class="profile-stat"><div class="profile-stat-n">'+Math.floor((localProfile.timePlayed||0)/60)+'м</div><div class="profile-stat-l">Время</div></div>';
  html+='<div class="profile-stat"><div class="profile-stat-n">'+(localProfile.achievements||[]).length+'</div><div class="profile-stat-l">Достижений</div></div>';
  html+='<div class="profile-stat"><div class="profile-stat-n">'+localProfile.level+'</div><div class="profile-stat-l">Уровень</div></div>';
  html+='</div>';
  html+='<div class="auth-section"><h4>🎨 Аватар</h4><p style="font-size:.8em;color:#aaa;margin-bottom:10px">Нажми на аватар выше чтобы изменить</p><div id="avatarPickerContainer"></div></div>';
  html+='<div class="auth-section"><h4>🔐 Аккаунт</h4>';
  if(isAuth){
    html+='<p style="font-size:.85em;color:#06ffa5;margin-bottom:10px">✅ '+currentUser.email+'</p>';
    html+='<button class="logout-btn" onclick="window.googleSignOut()">Выйти</button>';
  }else{
    html+='<div class="auth-tabs"><button class="auth-tab active" onclick="window.switchAuthTab(\'email\',this)">📧 Email</button><button class="auth-tab" onclick="window.switchAuthTab(\'google\',this)">🔵 Google</button></div>';
    html+='<div id="authEmail"><div class="auth-form">';
    html+='<input class="auth-input" id="authEmailIn" type="email" placeholder="Email">';
    html+='<input class="auth-input" id="authPassIn" type="password" placeholder="Пароль (мин. 6 символов)">';
    html+='<input class="auth-input" id="authNameIn" type="text" placeholder="Имя (для регистрации)">';
    html+='<button class="modal-btn" onclick="window.doEmailSignIn()">Войти</button>';
    html+='<button class="modal-btn s" onclick="window.doEmailSignUp()">Регистрация</button>';
    html+='</div></div>';
    html+='<div id="authGoogle" style="display:none">';
    html+='<button class="google-btn" onclick="window.googleSignIn()">Войти через Google</button></div>';
    html+='<div class="divider">или играй как гость</div>';
    html+='<button class="modal-btn ghost" onclick="window.changeName()">✏️ Сменить имя</button>';
  }
  html+='</div><button class="modal-btn" onclick="window.closeModal()">Закрыть</button></div>';
  modal.innerHTML=html;
  var bigAv=document.getElementById('bigAvatar');
  renderAvatar(bigAv,localProfile,'70px');
  var picker=document.getElementById('avatarPickerContainer');
  if(picker){
    var pickerHtml='<div class="avatar-picker">';
    avatarEmojis.forEach(function(e){
      var sel=(localProfile.avatar===e&&localProfile.avatarType==='emoji')?'selected':'';
      pickerHtml+='<div class="avatar-opt '+sel+'" onclick="window.setAvatar(\'emoji\',\''+e+'\')">'+e+'</div>';
    });
    avatarLetters.forEach(function(l){
      var sel=(localProfile.avatar===l&&localProfile.avatarType==='letter')?'selected':'';
      pickerHtml+='<div class="avatar-opt '+sel+'" onclick="window.setAvatar(\'letter\',\''+l+'\')">'+l+'</div>';
    });
    pickerHtml+='</div>';
    picker.innerHTML=pickerHtml;
  }
  document.getElementById('modal').classList.add('on');
};

window.showAvatarPicker=function(){
  var section=document.querySelector('.auth-section');
  if(section)section.scrollIntoView({behavior:'smooth'});
};

window.setAvatar=function(type,value){
  localProfile.avatarType=type;
  localProfile.avatar=value;
  if(type==='emoji'||type==='letter')localProfile.photo='';
  window.saveProfile();
  updateProfileUI();
  window.showProfile();
};

window.switchAuthTab=function(tab,btn){
  document.querySelectorAll('.auth-tab').forEach(function(t){t.classList.remove('active')});
  btn.classList.add('active');
  document.getElementById('authEmail').style.display=tab==='email'?'block':'none';
  document.getElementById('authGoogle').style.display=tab==='google'?'block':'none';
};

window.doEmailSignIn=function(){
  var e=document.getElementById('authEmailIn').value;
  var p=document.getElementById('authPassIn').value;
  if(!e||!p){alert('Введи email и пароль');return}
  window.emailSignIn(e,p);
};

window.doEmailSignUp=function(){
  var e=document.getElementById('authEmailIn').value;
  var p=document.getElementById('authPassIn').value;
  var n=document.getElementById('authNameIn').value;
  if(!e||!p){alert('Введи email и пароль');return}
  if(p.length<6){alert('Пароль минимум 6 символов');return}
  window.emailSignUp(e,p,n);
};

window.changeName=function(){
  var name=prompt('Новое имя:',localProfile.name);
  if(name&&name.trim()){localProfile.name=name.trim();window.saveProfile();updateProfileUI();window.showProfile()}
};

window.showSettings=function(){
  var modal=document.getElementById('modalContent');
  var html='<div class="profile-modal"><h3>⚙️ Настройки</h3>';
  html+='<div class="settings-grid"><div class="setting-card"><h5>🎨 Тема</h5><div class="theme-options">';
  Object.keys(THEMES).forEach(function(k){
    var v=THEMES[k];
    var sel=settings.theme===k?'selected':'';
    html+='<div class="theme-opt '+sel+'" style="background:linear-gradient(135deg,'+v.c1+','+v.c2+')" onclick="window.setTheme(\''+k+'\')"></div>';
  });
  html+='</div></div>';
  html+='<div class="setting-card"><h5>🌐 Язык</h5><select onchange="window.setLang(this.value)">';
  html+='<option value="ru" '+(settings.lang==='ru'?'selected':'')+'>🇷🇺 Русский</option>';
  html+='<option value="en" '+(settings.lang==='en'?'selected':'')+'>🇬🇧 English</option>';
  html+='</select></div></div>';
  html+='<h4 style="color:#ffbe0b;margin:15px 0 10px">🎬 Анимации</h4><div class="settings-grid">';
  var anims=[
    ['animTransitions','🔄 Переходы экранов'],
    ['animCards','🎴 Карточки игр'],
    ['animButtons','🔘 Кнопки'],
    ['animModals','💬 Модальные окна'],
    ['animTutorials','📚 Туториалы'],
    ['animConfetti','🎊 Конфетти'],
    ['animBlobs','🫧 Blob-фоны'],
    ['animLogo','✨ Логотип'],
    ['animPlay','▶️ Кнопка ИГРАТЬ'],
    ['animPulse','💓 Индикаторы']
  ];
  anims.forEach(function(a){
    html+='<div class="setting-card"><h5>'+a[1]+'</h5><label><input type="checkbox" '+(settings[a[0]]?'checked':'')+' onchange="window.toggleAnim(\''+a[0]+'\',this.checked)"> Включить</label></div>';
  });
  html+='<div class="setting-card"><h5>🌌 Частицы</h5><label><input type="checkbox" '+(settings.particles?'checked':'')+' onchange="window.toggleParticles(this.checked)"> Включить</label></div>';
  html+='<div class="setting-card"><h5>🔊 Звук</h5><label><input type="checkbox" '+(settings.sound?'checked':'')+' onchange="window.setSound(this.checked)"> Включить (скоро)</label></div>';
  html+='</div>';
  html+='<div style="margin-top:15px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center">';
  html+='<button class="modal-btn s" onclick="window.toggleAllAnims(false)">❌ Отключить все</button>';
  html+='<button class="modal-btn" onclick="window.toggleAllAnims(true)">✅ Включить все</button>';
  html+='</div><button class="modal-btn ghost" onclick="window.closeModal()">Закрыть</button></div>';
  modal.innerHTML=html;
  document.getElementById('modal').classList.add('on');
};

window.toggleAnim=function(key,value){settings[key]=value;localStorage.setItem('settings',JSON.stringify(settings));applyAnimations()};
window.toggleParticles=function(value){settings.particles=value;localStorage.setItem('settings',JSON.stringify(settings));applyAnimations()};
window.toggleAllAnims=function(value){
  ['animTransitions','animCards','animButtons','animModals','animTutorials','animConfetti','animBlobs','animLogo','animPlay','animPulse'].forEach(function(k){settings[k]=value});
  localStorage.setItem('settings',JSON.stringify(settings));
  applyAnimations();
  window.showSettings();
};

function initP(){pts=[];if(!settings.particles)return;var n=Math.min(80,Math.floor(window.innerWidth/20));for(var i=0;i<n;i++)pts.push({x:Math.random()*bg.width,y:Math.random()*bg.height,vx:(Math.random()-.5)*.6,vy:(Math.random()-.5)*.6,r:Math.random()*2.5+.5,c:['#00f2fe','#ff006e','#8338ec','#ffbe0b'][Math.floor(Math.random()*4)]})}
function abg(){
  if(!settings.particles){requestAnimationFrame(abg);return}
  bx.fillStyle='rgba(5,5,15,.2)';bx.fillRect(0,0,bg.width,bg.height);
  pts.forEach(function(p){p.x+=p.vx;p.y+=p.vy+scrollY*.001;if(p.x<0||p.x>bg.width)p.vx*=-1;if(p.y<0||p.y>bg.height)p.vy*=-1;bx.beginPath();bx.fillStyle=p.c;bx.shadowColor=p.c;bx.shadowBlur=12;bx.arc(p.x,p.y,p.r,0,6.28);bx.fill()});
  bx.shadowBlur=0;
  for(var i=0;i<pts.length;i++)for(var j=i+1;j<pts.length;j++){var d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);if(d<130){bx.strokeStyle='rgba(79,172,254,'+((1-d/130)*.25)+')';bx.lineWidth=.6;bx.beginPath();bx.moveTo(pts[i].x,pts[i].y);bx.lineTo(pts[j].x,pts[j].y);bx.stroke()}}
  requestAnimationFrame(abg);
}

var GM={};

GM.snake=function(ct){
  ct.innerHTML='<div class="gi2"><div>Счёт: <span class="v" id="ss">0</span></div><div>Рекорд: <span class="v" id="sb">'+window.getGameStats('snake').bestScore+'</span></div></div><canvas id="sc" class="gc" width="340" height="340"></canvas><div class="dp"><button class="u" data-d="0,-1">▲</button><button class="l" data-d="-1,0">◀</button><button class="r" data-d="1,0">▶</button><button class="d" data-d="0,1">▼</button></div><div><button class="gb" id="ss2">▶ Старт</button><button class="gb s" id="sp">⏸</button></div><div class="gh">💻 Стрелки/WASD · 📱 Свайпы</div>';
  var cv=document.getElementById('sc'),cx=cv.getContext('2d'),G=17,C=cv.width/G;
  var sn,dr,nd,fd,sc,best=+window.getGameStats('snake').bestScore||0,lp,pa,ov,foodEaten=0;
  function st(){sn=[{x:8,y:8}];dr={x:1,y:0};nd={x:1,y:0};sc=0;pa=ov=false;foodEaten=0;document.getElementById('ss').textContent=0;pfd();if(lp)clearInterval(lp);lp=setInterval(up,120)}
  function pfd(){do{fd={x:Math.floor(Math.random()*G),y:Math.floor(Math.random()*G)}}while(sn.some(function(s){return s.x===fd.x&&s.y===fd.y}))}
  function sd(x,y){if(dr.x===-x&&dr.y===-y)return;if(x&&dr.x===x)return;if(y&&dr.y===y)return;nd={x:x,y:y}}
  function up(){
    if(pa||ov)return;dr=nd;
    var h={x:sn[0].x+dr.x,y:sn[0].y+dr.y};
    if(h.x<0||h.x>=G||h.y<0||h.y>=G||sn.some(function(s){return s.x===h.x&&s.y===h.y})){
      ov=true;clearInterval(lp);cv.style.animation='sk .4s';setTimeout(function(){cv.style.animation=''},400);
      window.updateGameStats('snake',{played:1,losses:1,bestScore:sc,totalScore:sc,itemsCollected:foodEaten});
      localProfile.gamesPlayed++;localProfile.losses++;localProfile.totalScore+=sc;window.addXP(sc);updateMenuInfo();
      if(sc>best){best=sc;document.getElementById('sb').textContent=best;window.conf();window.showModal('🏆 Рекорд!','Счёт: '+sc)}
      else window.showModal('Game Over','Счёт: '+sc);
    }else{
      sn.unshift(h);
      if(h.x===fd.x&&h.y===fd.y){sc++;foodEaten++;document.getElementById('ss').textContent=sc;pfd()}
      else sn.pop();
    }
    dr2();
  }
  function dr2(){
    cx.fillStyle='#0a0a1e';cx.fillRect(0,0,cv.width,cv.height);
    cx.fillStyle='#ff6b9d';cx.shadowColor='#ff6b9d';cx.shadowBlur=12;
    cx.beginPath();cx.arc(fd.x*C+C/2,fd.y*C+C/2,C/2-2,0,6.28);cx.fill();cx.shadowBlur=0;
    sn.forEach(function(s,i){
      var g=cx.createRadialGradient(s.x*C+C/2,s.y*C+C/2,2,s.x*C+C/2,s.y*C+C/2,C/2);
      if(i===0){g.addColorStop(0,'#00f2fe');g.addColorStop(1,'#0077b6');cx.shadowColor='#00f2fe';cx.shadowBlur=8}
      else{g.addColorStop(0,'#4facfe');g.addColorStop(1,'#023e8a');cx.shadowBlur=0}
      cx.fillStyle=g;cx.fillRect(s.x*C+1,s.y*C+1,C-2,C-2);
    });
    cx.shadowBlur=0;
    if(ov){cx.fillStyle='rgba(0,0,0,.8)';cx.fillRect(0,0,cv.width,cv.height);cx.fillStyle='#ff6b9d';cx.font='bold 24px sans-serif';cx.textAlign='center';cx.fillText('GAME OVER',cv.width/2,cv.height/2-10);cx.fillStyle='#fff';cx.font='14px sans-serif';cx.fillText('Счёт: '+sc,cv.width/2,cv.height/2+15)}
    if(pa&&!ov){cx.fillStyle='rgba(0,0,0,.7)';cx.fillRect(0,0,cv.width,cv.height);cx.fillStyle='#00f2fe';cx.font='bold 28px sans-serif';cx.textAlign='center';cx.fillText('⏸ ПАУЗА',cv.width/2,cv.height/2)}
  }
  var kh=function(e){var k=e.key.toLowerCase();if(k==='arrowup'||k==='w'){e.preventDefault();sd(0,-1)}else if(k==='arrowdown'||k==='s'){e.preventDefault();sd(0,1)}else if(k==='arrowleft'||k==='a'){e.preventDefault();sd(-1,0)}else if(k==='arrowright'||k==='d'){e.preventDefault();sd(1,0)}else if(k===' '){e.preventDefault();pa=!pa}};
  document.addEventListener('keydown',kh);
  var ts=null;
  var tse=function(e){e.preventDefault();ts={x:e.touches[0].clientX,y:e.touches[0].clientY}};
  var tnd=function(e){if(!ts)return;var dx=e.changedTouches[0].clientX-ts.x,dy=e.changedTouches[0].clientY-ts.y;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;if(Math.abs(dx)>Math.abs(dy))sd(dx>0?1:-1,0);else sd(0,dy>0?1:-1);ts=null};
  cv.addEventListener('touchstart',tse,{passive:false});
  cv.addEventListener('touchend',tnd);
  ct.querySelectorAll('.dp button').forEach(function(b){b.onclick=function(){var xy=b.dataset.d.split(',').map(Number);sd(xy[0],xy[1])}});
  document.getElementById('ss2').onclick=st;
  document.getElementById('sp').onclick=function(){if(!ov)pa=!pa};
  st();
  window._cleanup=function(){clearInterval(lp);document.removeEventListener('keydown',kh);cv.removeEventListener('touchstart',tse);cv.removeEventListener('touchend',tnd)};
};
