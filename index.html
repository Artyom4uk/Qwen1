<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NEON ARCADE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;background:#05050f;color:#e0e0ff;font-family:'Segoe UI',system-ui,sans-serif}
body{min-height:100vh;position:relative}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.blob{position:fixed;border-radius:50%;filter:blur(120px);opacity:.35;z-index:0;pointer-events:none;animation:bm 30s infinite ease-in-out alternate}
.b1{width:600px;height:600px;background:#ff006e;top:-200px;left:-200px}
.b2{width:700px;height:700px;background:#00f2fe;bottom:-250px;right:-250px;animation-delay:-10s}
.b3{width:500px;height:500px;background:#8338ec;top:40%;left:50%;animation-delay:-20s}
@keyframes bm{0%{transform:translate(0,0) scale(1)}50%{transform:translate(150px,-80px) scale(1.2)}100%{transform:translate(-100px,100px) scale(.9)}}
.screen{position:relative;z-index:1;padding:15px;display:none;opacity:0;transform:translateY(20px);transition:opacity .4s,transform .4s}
.screen.on{display:block;opacity:1;transform:translateY(0)}
.screen.exit{opacity:0;transform:translateY(-20px)}
.profile-bar{position:fixed;top:10px;right:10px;z-index:100;display:flex;align-items:center;gap:8px;background:rgba(10,10,30,.95);border:1px solid rgba(0,242,254,.4);border-radius:50px;padding:5px 14px 5px 5px;backdrop-filter:blur(15px);cursor:pointer;transition:all .3s;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.profile-bar:hover{border-color:#00f2fe;box-shadow:0 0 25px rgba(0,242,254,.5);transform:translateY(-2px)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ff006e,#8338ec);display:flex;align-items:center;justify-content:center;font-size:1em;font-weight:bold;color:#fff;border:2px solid #00f2fe;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-info{display:flex;flex-direction:column;min-width:0}
.profile-name{font-size:.8em;font-weight:bold;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-level{font-size:.65em;color:#00f2fe}
.profile-xp-bar{width:70px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:2px;overflow:hidden}
.profile-xp-fill{height:100%;background:linear-gradient(90deg,#00f2fe,#8338ec);transition:width .5s}
.sync-indicator{position:fixed;top:10px;left:10px;z-index:100;padding:6px 12px;background:rgba(10,10,30,.9);border:1px solid rgba(6,255,165,.4);border-radius:20px;font-size:.75em;color:#06ffa5;backdrop-filter:blur(10px);display:flex;align-items:center;gap:6px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#06ffa5;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(15px);z-index:1000;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;padding:15px}
.modal-overlay.on{display:flex;opacity:1}
.modal{background:linear-gradient(135deg,#0f0f2e,#1a1a3e);border:2px solid #4facfe;border-radius:20px;padding:25px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;text-align:center;transform:scale(.8);transition:transform .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 20px 60px rgba(0,0,0,.8)}
.modal-overlay.on .modal{transform:scale(1)}
.modal h3{font-size:1.8em;margin-bottom:12px;background:linear-gradient(90deg,#00f2fe,#ff006e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal p{font-size:1em;color:#ccc;margin-bottom:15px;line-height:1.5}
.modal-btn{padding:12px 30px;background:linear-gradient(135deg,#4facfe,#00f2fe);border:none;color:#fff;border-radius:25px;cursor:pointer;font-size:1em;font-weight:bold;transition:all .3s;box-shadow:0 6px 20px rgba(0,242,254,.4);margin:4px}
.modal-btn:hover{transform:scale(1.05)}
.modal-btn.s{background:linear-gradient(135deg,#ff006e,#8338ec)}
.modal-btn.ghost{background:transparent;border:2px solid #4facfe}
.profile-modal{display:flex;flex-direction:column;gap:15px}
.profile-header{display:flex;align-items:center;gap:15px;padding:15px;background:rgba(0,0,0,.3);border-radius:15px;border:1px solid rgba(0,242,254,.2)}
.profile-avatar-big{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#ff006e,#8338ec);display:flex;align-items:center;justify-content:center;font-size:2em;font-weight:bold;color:#fff;border:3px solid #00f2fe;flex-shrink:0;overflow:hidden}
.profile-avatar-big img{width:100%;height:100%;object-fit:cover}
.profile-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.profile-stat{background:rgba(0,0,0,.3);padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.1)}
.profile-stat-n{font-size:1.3em;font-weight:bold;color:#00f2fe}
.profile-stat-l{font-size:.75em;color:#aaa}
.auth-section{padding:15px;background:rgba(0,0,0,.3);border-radius:12px;border:1px dashed rgba(255,255,255,.2)}
.auth-section h4{margin-bottom:8px;color:#ffbe0b;font-size:1em}
.google-btn{width:100%;padding:12px;background:#fff;color:#333;border:none;border-radius:20px;cursor:pointer;font-weight:bold;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .3s;font-size:.95em}
.google-btn:hover{transform:scale(1.02);box-shadow:0 5px 20px rgba(255,255,255,.3)}
.logout-btn{width:100%;padding:10px;background:transparent;color:#ff006e;border:2px solid #ff006e;border-radius:20px;cursor:pointer;font-weight:bold;transition:all .3s;font-size:.9em;margin-top:8px}
.logout-btn:hover{background:#ff006e;color:#fff}
#title{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100vh;padding:15px}
#title.on{display:flex}
.logo{font-size:clamp(3em,10vw,5.5em);font-weight:900;letter-spacing:6px;background:linear-gradient(90deg,#ff006e,#00f2fe,#8338ec,#ffbe0b,#ff006e);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:sh 4s linear infinite,fl 3s ease-in-out infinite;margin-bottom:10px}
.sub{font-size:1.1em;color:#aaa;margin-bottom:40px;letter-spacing:3px}
@keyframes sh{to{background-position:300% center}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.btn-ripple{position:relative;overflow:hidden;transition:all .3s cubic-bezier(.4,0,.2,1)}
.btn-ripple::after{content:'';position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;background:rgba(255,255,255,.5);transform:translate(-50%,-50%);transition:width .6s,height .6s}
.btn-ripple:active::after{width:300px;height:300px}
.btn-ripple:active{transform:scale(.95)}
.play{padding:22px 70px;font-size:1.8em;font-weight:bold;letter-spacing:5px;color:#fff;background:linear-gradient(135deg,#ff006e,#8338ec);border:none;border-radius:50px;cursor:pointer;box-shadow:0 12px 40px rgba(255,0,110,.6);animation:pb 2.5s infinite}
.play:hover{transform:translateY(-4px) scale(1.04)}
@keyframes pb{0%,100%{box-shadow:0 12px 40px rgba(255,0,110,.6)}50%{box-shadow:0 12px 50px rgba(255,0,110,.9),0 0 80px rgba(131,56,236,.5)}}
.stats-row{margin-top:35px;display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.stat{text-align:center;padding:15px 22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:15px;backdrop-filter:blur(10px);transition:all .3s}
.stat:hover{transform:translateY(-4px);border-color:#00f2fe}
.stat-n{font-size:2em;font-weight:bold;color:#00f2fe}
.stat-l{font-size:.8em;color:#aaa;margin-top:5px;letter-spacing:1px}
.mh{text-align:center;margin-bottom:20px}
.mh h2{font-size:2.2em;background:linear-gradient(90deg,#00f2fe,#ff006e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.mh p{color:#888;font-size:.95em}
.ma{display:flex;justify-content:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.ab{padding:10px 25px;background:rgba(255,255,255,.08);border:2px solid #00f2fe;color:#fff;border-radius:30px;cursor:pointer;font-size:.95em;font-weight:600;transition:all .3s}
.ab:hover{background:#00f2fe;color:#05050f;transform:translateY(-3px)}
.ab.r{border-color:#ff006e}.ab.r:hover{background:#ff006e}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px;max-width:1100px;margin:0 auto;padding-bottom:30px}
.gc{position:relative;aspect-ratio:1;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);border-radius:20px;cursor:pointer;transition:all .4s cubic-bezier(.34,1.56,.64,1);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px;text-align:center}
.gc::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--c1,#ff006e),var(--c2,#8338ec));opacity:0;transition:opacity .4s;border-radius:18px}
.gc:hover::before{opacity:.35}
.gc:hover{transform:translateY(-10px) scale(1.04);border-color:var(--c1,#ff006e);box-shadow:0 15px 40px rgba(0,0,0,.5),0 0 30px var(--c1,#ff006e)}
.gc>*{position:relative;z-index:1}
.gi{font-size:3em;margin-bottom:8px;filter:drop-shadow(0 0 12px currentColor);transition:transform .4s}
.gc:hover .gi{transform:scale(1.15) rotate(-6deg)}
.gn{font-size:1em;font-weight:bold;margin-bottom:4px}
.gd{font-size:.75em;color:#aaa}
.gs{max-width:720px;margin:0 auto}
.gt{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px}
.bb{padding:9px 18px;background:rgba(255,255,255,.08);border:2px solid #ff006e;color:#fff;border-radius:25px;cursor:pointer;font-size:.9em;font-weight:600;transition:all .3s}
.bb:hover{background:#ff006e;transform:translateX(-4px)}
.gtt{font-size:1.4em;background:linear-gradient(90deg,#00f2fe,#ff006e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:bold}
.stats-btn{padding:7px 15px;background:rgba(255,255,255,.08);border:2px solid #ffbe0b;color:#fff;border-radius:25px;cursor:pointer;font-size:.8em;font-weight:600;transition:all .3s}
.stats-btn:hover{background:#ffbe0b;color:#05050f}
.gc2{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:20px;text-align:center;backdrop-filter:blur(15px)}
canvas.gc{background:#0a0a1e;border:2px solid #4facfe;border-radius:12px;max-width:100%;touch-action:none;display:block;margin:0 auto}
.gi2{display:flex;justify-content:space-around;margin:12px 0;font-size:1.05em;flex-wrap:wrap;gap:10px}
.gi2 span.v{color:#00f2fe;font-weight:bold}
.gb{padding:9px 22px;background:linear-gradient(135deg,#4facfe,#00f2fe);border:none;color:#fff;border-radius:22px;cursor:pointer;margin:4px;font-size:.9em;font-weight:bold;transition:all .3s}
.gb:hover{transform:translateY(-2px) scale(1.04)}
.gb.s{background:linear-gradient(135deg,#ff006e,#8338ec)}
.gh{margin-top:12px;font-size:.8em;color:#888;line-height:1.5}
.tutorial{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(200px);background:rgba(10,10,30,.95);border:2px solid #00f2fe;border-radius:15px;padding:15px 25px;max-width:90%;z-index:999;opacity:0;transition:all .5s cubic-bezier(.34,1.56,.64,1)}
.tutorial.on{transform:translateX(-50%) translateY(0);opacity:1}
.tutorial-icon{font-size:1.8em;margin-bottom:6px}
.tutorial-text{font-size:.9em;color:#fff;line-height:1.4}
.tutorial-close{position:absolute;top:6px;right:10px;background:none;border:none;color:#fff;font-size:1.3em;cursor:pointer;opacity:.6}
.tutorial-close:hover{opacity:1}
.cf{position:fixed;width:10px;height:10px;pointer-events:none;z-index:1001;animation:cf 2.5s ease-in forwards}
@keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.dp{display:none;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:6px;justify-content:center;margin:15px auto}
.dp button{background:rgba(79,172,254,.2);border:2px solid #4facfe;color:#fff;border-radius:12px;font-size:1.6em;cursor:pointer}
.dp button:active{background:#4facfe;transform:scale(.9)}
.dp .u{grid-column:2;grid-row:1}.dp .l{grid-column:1;grid-row:2}.dp .r{grid-column:3;grid-row:2}.dp .d{grid-column:2;grid-row:3}
.tw{position:relative;display:inline-block}
.tb{display:grid;grid-template-columns:repeat(3,80px);gap:6px;justify-content:center;margin:15px auto}
.tc{width:80px;height:80px;background:rgba(255,255,255,.05);border:2px solid #4facfe;border-radius:10px;font-size:2.5em;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s}
.tc:hover:not(.x):not(.o){background:rgba(79,172,254,.2);transform:scale(1.06)}
.tc.x{color:#00f2fe;animation:pi .4s;text-shadow:0 0 15px #00f2fe}
.tc.o{color:#ff6b9d;animation:pi .4s;text-shadow:0 0 15px #ff6b9d}
.tc.w{animation:wp 1s infinite alternate}
.ts{position:absolute;inset:0;pointer-events:none}
.ts line{stroke:#ffd700;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 8px #ffd700);stroke-dasharray:500;stroke-dashoffset:500;animation:dl .6s forwards}
.mt{display:flex;justify-content:center;gap:8px;margin:12px 0;flex-wrap:wrap}
.mt button{padding:7px 14px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.2);color:#fff;border-radius:20px;cursor:pointer;transition:all .3s;font-size:.8em;font-weight:600}
.mt button:hover{transform:translateY(-2px)}
.mt button.on{background:#4facfe;border-color:#4facfe}
.st{font-size:1.1em;margin:8px 0;min-height:25px;font-weight:600}
@keyframes pi{from{opacity:0;transform:scale(.3) rotate(-180deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes wp{from{background:rgba(255,215,0,.1)}to{background:rgba(255,215,0,.3);box-shadow:0 0 25px #ffd700}}
@keyframes dl{to{stroke-dashoffset:0}}
@keyframes sk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.g2048{display:grid;grid-template-columns:repeat(4,65px);gap:6px;background:rgba(0,0,0,.3);padding:8px;border-radius:12px;justify-content:center;margin:15px auto;width:fit-content}
.g2048 div{width:65px;height:65px;background:rgba(255,255,255,.05);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.3em;font-weight:bold;transition:all .2s}
.mb{display:grid;grid-template-columns:repeat(4,65px);gap:6px;justify-content:center;margin:15px auto}
.mc{width:65px;height:65px;background:linear-gradient(135deg,#4facfe,#00f2fe);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.8em;transition:transform .5s}
.mc.f{background:rgba(255,255,255,.1);transform:rotateY(180deg)}
.mc.m{background:linear-gradient(135deg,#06ffa5,#00f2fe)}
.mc span{transform:rotateY(180deg)}
.sb{display:grid;grid-template-columns:repeat(2,100px);gap:10px;justify-content:center;margin:15px auto}
.sb div{width:100px;height:100px;border-radius:12px;cursor:pointer;opacity:.5;transition:all .3s;border:3px solid rgba(255,255,255,.1)}
.sb div.on{opacity:1;transform:scale(1.08);box-shadow:0 0 35px currentColor}
.sb .r{background:#ff006e;color:#ff006e}.sb .g{background:#06ffa5;color:#06ffa5}.sb .b{background:#4facfe;color:#4facfe}.sb .y{background:#ffbe0b;color:#ffbe0b}
.wh{display:grid;grid-template-columns:repeat(3,80px);gap:8px;justify-content:center;margin:15px auto}
.wh div{width:80px;height:80px;background:radial-gradient(circle,#3a2a1a,#1a1a0a);border-radius:50%;cursor:pointer;position:relative;overflow:hidden;border:3px solid #5a4a3a}
.wh div .mo{position:absolute;bottom:-100%;left:50%;transform:translateX(-50%);font-size:2.5em;transition:bottom .2s}
.wh div.on .mo{bottom:12%}
.rp{display:flex;justify-content:center;gap:15px;margin:15px 0}
.rp div{width:75px;height:75px;background:rgba(255,255,255,.05);border:2px solid #4facfe;border-radius:50%;font-size:2.5em;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s}
.rp div:hover{transform:scale(1.15) rotate(12deg);border-color:#ff006e}
.rr{display:flex;justify-content:space-around;align-items:center;margin:15px 0;font-size:2.5em}
.rr div{padding:12px;background:rgba(255,255,255,.05);border-radius:12px;min-width:90px}
.aa{position:relative;width:100%;max-width:350px;height:350px;background:rgba(0,0,0,.3);border:2px solid #4facfe;border-radius:12px;margin:15px auto;overflow:hidden;cursor:crosshair}
.at{position:absolute;width:45px;height:45px;border-radius:50%;background:radial-gradient(circle,#ff006e,#8338ec);box-shadow:0 0 20px #ff006e;cursor:pointer;animation:pi .3s}
.cw{font-size:2.2em;font-weight:bold;margin:12px 0;min-height:60px;text-shadow:0 0 25px currentColor}
.co{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.co div{padding:10px 18px;border-radius:12px;cursor:pointer;font-weight:bold;color:#fff;border:2px solid transparent;transition:all .3s}
.co div:hover{transform:scale(1.12)}
.rx{width:100%;max-width:350px;height:240px;margin:15px auto;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:1.3em;font-weight:bold;cursor:pointer;user-select:none;transition:all .3s}
.ms{display:grid;gap:2px;justify-content:center;margin:15px auto;width:fit-content}
.ms div{width:30px;height:30px;background:rgba(79,172,254,.3);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:bold;font-size:.85em;border-radius:4px;transition:all .2s}
.ms div:hover{background:rgba(79,172,254,.5)}
.ms div.o{background:rgba(0,0,0,.3);cursor:default}
.ms div.f{background:rgba(255,190,11,.3)}
.ms div.m{background:#ff006e}
.hang-word{font-size:2em;letter-spacing:6px;margin:12px 0;font-weight:bold;color:#00f2fe}
.hang-letters{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:12px 0}
.hang-letters button{width:36px;height:36px;background:rgba(255,255,255,.1);border:2px solid #4facfe;color:#fff;border-radius:8px;cursor:pointer;font-weight:bold;transition:all .2s;font-size:.9em}
.hang-letters button:hover:not(:disabled){background:#4facfe;transform:scale(1.08)}
.hang-letters button:disabled{opacity:.3;cursor:not-allowed}
.hang-letters button.wrong{background:#ff006e;border-color:#ff006e}
.hang-letters button.right{background:#06ffa5;border-color:#06ffa5;color:#000}
.guess-input{padding:10px;font-size:1.2em;background:rgba(0,0,0,.3);border:2px solid #4facfe;color:#fff;border-radius:10px;text-align:center;width:120px;margin:8px}
.guess-hint{font-size:1.1em;margin:8px 0;color:#ffbe0b;min-height:30px}
@media(max-width:600px){
.dp{display:grid}
.profile-bar{top:8px;right:8px;padding:4px 10px 4px 4px;gap:6px}
.profile-info{display:none}
.avatar{width:30px;height:30px;font-size:.9em}
.gg{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gi{font-size:2.5em}
.tb{grid-template-columns:repeat(3,70px)}.tc{width:70px;height:70px;font-size:2em}
.mb{grid-template-columns:repeat(4,60px)}.mc{width:60px;height:60px;font-size:1.5em}
.g2048{grid-template-columns:repeat(4,60px)}.g2048 div{width:60px;height:60px;font-size:1.1em}
.sb{grid-template-columns:repeat(2,90px)}.sb div{width:90px;height:90px}
.logo{letter-spacing:3px}
.mh h2{font-size:1.8em}
.mh{margin-bottom:15px}
.play{padding:18px 55px;font-size:1.5em}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div class="sync-indicator" id="syncInd"><div class="sync-dot"></div><span id="syncText">Локально</span></div>

<div class="profile-bar btn-ripple" onclick="showProfile()">
<div class="avatar" id="pAvatar">?</div>
<div class="profile-info">
<div class="profile-name" id="pName">Гость</div>
<div class="profile-level" id="pLevel">Уровень 1</div>
<div class="profile-xp-bar"><div class="profile-xp-fill" id="pXpFill" style="width:0%"></div></div>
</div>
</div>

<div class="modal-overlay" id="modal"><div class="modal" id="modalContent"></div></div>

<div class="tutorial" id="tutorial">
<button class="tutorial-close" onclick="hideTutorial()">×</button>
<div class="tutorial-icon" id="tutIcon"></div>
<div class="tutorial-text" id="tutText"></div>
</div>

<section id="title" class="screen on">
<div class="logo">NEON ARCADE</div>
<div class="sub">· 20 ИГР · БЕСКОНЕЧНОЕ ВЕСЕЛЬЕ ·</div>
<button class="play btn-ripple" onclick="go('menu')">▶ ИГРАТЬ</button>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

// ===== ТВОЙ FIREBASE КОНФИГ =====
const firebaseConfig = {
  apiKey: "AIzaSyAL7HZLqk4vxgb-1F_UUUpy5bH7174dfMw",
  authDomain: "neon-arcade-57b46.firebaseapp.com",
  projectId: "neon-arcade-57b46",
  storageBucket: "neon-arcade-57b46.firebasestorage.app",
  messagingSenderId: "550252728845",
  appId: "1:550252728845:web:50225274eb65f6aa087b44",
  measurementId: "G-SRWKK80M2Y"
};

let db = null, auth = null, currentUser = null, useFirebase = false;
let localProfile = JSON.parse(localStorage.getItem('profile') || '{"name":"Гость","xp":0,"level":1,"gamesPlayed":0,"wins":0,"losses":0,"totalScore":0,"bestStreak":0,"timePlayed":0,"achievements":[],"joined":'+Date.now()+'}');
let localStats = {};

try {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  useFirebase = true;
  document.getElementById('syncText').textContent = '☁️ Облако';
} catch(e) {
  console.log('Firebase init failed, using localStorage:', e);
}

// ===== АВТОРИЗАЦИЯ =====
window.googleSignIn = async () => {
  if (!useFirebase) { alert('Firebase не инициализирован'); return; }
  try {
    const provider = new GoogleAuthProvider();
    await signInWithPopup(auth, provider);
  } catch(e) {
    console.error(e);
    alert('Ошибка входа: ' + e.message);
  }
};

window.googleSignOut = async () => {
  if (!useFirebase) return;
  await signOut(auth);
};

if (useFirebase) {
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      const userRef = doc(db, 'users', user.uid);
      const snap = await getDoc(userRef);
      if (!snap.exists()) {
        await setDoc(userRef, {
          name: user.displayName || 'Игрок',
          photo: user.photoURL || '',
          xp: 0, level: 1, gamesPlayed: 0, wins: 0, losses: 0,
          totalScore: 0, bestStreak: 0, timePlayed: 0,
          achievements: [], joined: Date.now()
        });
      }
      onSnapshot(userRef, (d) => {
        if (d.exists()) {
          const data = d.data();
          if (data.gameStats) localStats = data.gameStats;
          localProfile = { ...localProfile, ...data };
          updateProfileUI();
        }
      });
    } else {
      currentUser = null;
      updateProfileUI();
    }
  });
}

// ===== СОХРАНЕНИЕ =====
window.saveProfile = async () => {
  if (useFirebase && currentUser) {
    try { await updateDoc(doc(db, 'users', currentUser.uid), localProfile); }
    catch(e) { console.error('Save error:', e); }
  } else {
    localStorage.setItem('profile', JSON.stringify(localProfile));
  }
};

function defaultStats() {
  return {played:0,wins:0,losses:0,bestScore:0,totalScore:0,avgScore:0,bestTime:0,worstTime:999999,totalTime:0,currentStreak:0,bestStreak:0,perfectGames:0,failedAttempts:0,accuracy:0,clicks:0,misses:0,levelsCompleted:0,highestLevel:0,itemsCollected:0,enemiesDefeated:0,damageTaken:0,healsUsed:0,powerupsUsed:0,secretsFound:0};
}

window.getGameStats = (id) => {
  if (useFirebase && currentUser) return localStats[id] || defaultStats();
  return JSON.parse(localStorage.getItem('stats_'+id) || JSON.stringify(defaultStats()));
};

window.saveGameStats = async (id, stats) => {
  if (useFirebase && currentUser) {
    localStats[id] = stats;
    try { await updateDoc(doc(db, 'users', currentUser.uid), { ['gameStats.'+id]: stats }); }
    catch(e) { console.error(e); }
  } else {
    localStorage.setItem('stats_'+id, JSON.stringify(stats));
  }
};

window.updateGameStats = async (id, update) => {
  const stats = window.getGameStats(id);
  Object.keys(update).forEach(k => {
    if (k==='bestScore') stats.bestScore = Math.max(stats.bestScore, update[k]);
    else if (k==='bestTime') stats.bestTime = update[k] < stats.bestTime ? update[k] : stats.bestTime;
    else if (k==='worstTime') stats.worstTime = update[k] > stats.worstTime ? update[k] : stats.worstTime;
    else if (k==='currentStreak') { stats.currentStreak = update[k]; stats.bestStreak = Math.max(stats.bestStreak, update[k]); }
    else if (typeof stats[k]==='number') stats[k] += update[k];
  });
  stats.avgScore = stats.played ? Math.round(stats.totalScore/stats.played) : 0;
  stats.accuracy = stats.clicks ? Math.round(stats.clicks/(stats.clicks+stats.misses)*100) : 0;
  await window.saveGameStats(id, stats);
};

// ===== ПРОФИЛЬ UI =====
window.updateProfileUI = () => {
  document.getElementById('pName').textContent = localProfile.name;
  document.getElementById('pLevel').textContent = 'Уровень ' + localProfile.level;
  const avatar = document.getElementById('pAvatar');
  if (localProfile.photo) {
    avatar.innerHTML = `<img src="${localProfile.photo}" alt="">`;
  } else {
    avatar.textContent = localProfile.name[0].toUpperCase();
  }
  const needed = localProfile.level * 100;
  document.getElementById('pXpFill').style.width = (localProfile.xp/needed*100) + '%';
  document.getElementById('totalGames').textContent = localProfile.gamesPlayed || 0;
  document.getElementById('totalWins').textContent = localProfile.wins || 0;
};

window.addXP = async (amount) => {
  localProfile.xp += amount;
  const needed = localProfile.level * 100;
  if (localProfile.xp >= needed) {
    localProfile.xp -= needed;
    localProfile.level++;
    showModal('🎉 Уровень ' + localProfile.level + '!', 'Ты получил новый уровень!');
  }
  await window.saveProfile();
  window.updateProfileUI();
};

      <div class="profile-header">
        <div class="profile-avatar-big">
          ${localProfile.photo ? `<img src="${localProfile.photo}">` : localProfile.name[0].toUpperCase()}

        <div style="text-align:left;flex:1">
          <div style="font-size:1.3em;font-weight:bold">${localProfile.name}</div>

          <div style="font-size:.75em;color:#888;margin-top:4px">
            ${isAuth ? '☁️ Синхронизировано · ' + currentUser.email : '💾 Локально'} · С ${new Date(localProfile.joined).toLocaleDateString('ru')}
          </div>
        </div>
      </div>
      <div class="profile-stats">
        <div class="profile-stat"><div class="profile-stat-n">${localProfile.gamesPlayed||0}</div><div class="profile-stat-l">Игр</div></div>
        <div class="profile-stat"><div class="profile-stat-n">${localProfile.wins||0}</div><div class="profile-stat-l">Побед</div></div>
        <div class="profile-stat"><div class="profile-stat-n">${localProfile.losses||0}</div><div class="profile-stat-l">Поражений</div></div>
        <div class="profile-stat"><div class="profile-stat-n">${localProfile.totalScore||0}</div><div class="profile-stat-l">Очков</div></div>
        <div class="profile-stat"><div class="profile-stat-n">${localProfile.bestStreak||0}</div><div class="profile-stat-l">Серия</div></div>
        <div class="profile-stat"><div class="profile-stat-n">${Math.floor((localProfile.timePlayed||0)/60)}м</div><div class="profile-stat-l">Время</div></div>
        <div class="profile-stat"><div class="profile-stat-n">${(localProfile.achievements||[]).length}</div><div class="profile-stat-l">Достижений</div></div>
        <div class="profile-stat"><div class="profile-stat-n">${localProfile.level}</div><div class="profile-stat-l">Уровень</div></div>
      </div>
      <div class="auth-section">
        <h4>🔐 Аккаунт</h4>
        ${isAuth
          ? `<p style="font-size:.85em;color:#06ffa5;margin-bottom:10px">✅ Вошёл как ${currentUser.email}</p>
             <button class="logout-btn" onclick="googleSignOut()">Выйти</button>`
          : `<p style="font-size:.85em;color:#aaa;margin-bottom:10px">Войди чтобы синхронизировать прогресс между устройствами</p>
             <button class="google-btn" onclick="googleSignIn()">
               <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
               Войти через Google
             </button>`
        }
      </div>
      <button class="modal-btn ghost" onclick="changeName()">✏️ Сменить имя</button>
      <button class="modal-btn" onclick="closeModal()">Закрыть</button>
    </div>`;
  document.getElementById('modal').classList.add('on');
};

window.changeName = async () => {
  const name = prompt('Новое имя:', localProfile.name);
  if (name && name.trim()) {
    localProfile.name = name.trim();
    await window.saveProfile();
    window.updateProfileUI();
    window.showProfile();
  }
};

window.updateProfileUI();

// ===== НАВИГАЦИЯ =====
let currentScreen = 'title';
window.go = (id) => {
  const cur = document.getElementById(currentScreen);
  cur.classList.add('exit');
  setTimeout(() => {
    cur.classList.remove('on', 'exit');
    document.getElementById(id).classList.add('on');
    currentScreen = id;
    scrollTo({top:0,behavior:'smooth'});
  }, 300);
};
window.back = () => { if(cleanup){cleanup();cleanup=null} window.go('menu') };

// ===== МОДАЛКА =====
window.showModal = (title, text, buttons) => {
  const modal = document.getElementById('modalContent');
  let btnsHtml = '<button class="modal-btn" onclick="closeModal()">OK</button>';
  if (buttons) { btnsHtml = buttons.map(b => `<button class="modal-btn ${b.class||''}" onclick="${b.action}">${b.text}</button>`).join(''); }
  modal.innerHTML = `<h3>${title}</h3><p>${text}</p><div>${btnsHtml}</div>`;
  document.getElementById('modal').classList.add('on');
};
window.closeModal = () => { document.getElementById('modal').classList.remove('on'); };
document.getElementById('modal').onclick = e => { if(e.target.id==='modal') window.closeModal(); };

// ===== ТУТОРИАЛ =====
let tutTimeout;
window.showTutorial = (icon, text) => {
  if (localStorage.getItem('tut_'+icon)) return;
  document.getElementById('tutIcon').textContent = icon;
  document.getElementById('tutText').textContent = text;
  document.getElementById('tutorial').classList.add('on');
  localStorage.setItem('tut_'+icon, '1');
  tutTimeout = setTimeout(window.hideTutorial, 5000);
};
window.hideTutorial = () => { document.getElementById('tutorial').classList.remove('on'); clearTimeout(tutTimeout); };

// ===== КОНФЕТТИ =====
window.conf = () => {
  const cs = ['#00f2fe','#ff006e','#ffbe0b','#8338ec','#06ffa5'];
  for (let i=0;i<35;i++) {
    const c = document.createElement('div');
    c.className = 'cf';
    c.style.left = Math.random()*100+'vw';
    c.style.background = cs[Math.random()*5|0];
    c.style.animationDuration = (2+Math.random()*2)+'s';
    if (Math.random()>.5) c.style.borderRadius = '50%';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 4000);
  }
};

const bg=document.getElementById('bg'),bx=bg.getContext('2d');
let pts=[],scrollY=0;
function rbg(){bg.width=innerWidth;bg.height=innerHeight;initP()}
rbg();addEventListener('resize',rbg);
