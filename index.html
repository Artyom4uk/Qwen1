<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NEON ARCADE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;background:#05050f;color:#e0e0ff;font-family:'Segoe UI',system-ui,sans-serif;transition:background .5s}
body{min-height:100vh;position:relative}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.blob{position:fixed;border-radius:50%;filter:blur(120px);opacity:.35;z-index:0;pointer-events:none;animation:bm 30s infinite ease-in-out alternate}
.b1{width:600px;height:600px;background:var(--c1,#ff006e);top:-200px;left:-200px}
.b2{width:700px;height:700px;background:var(--c2,#00f2fe);bottom:-250px;right:-250px;animation-delay:-10s}
.b3{width:500px;height:500px;background:var(--c3,#8338ec);top:40%;left:50%;animation-delay:-20s}
@keyframes bm{0%{transform:translate(0,0) scale(1)}50%{transform:translate(150px,-80px) scale(1.2)}100%{transform:translate(-100px,100px) scale(.9)}}
.screen{position:relative;z-index:1;padding:15px;display:none;opacity:0;transform:translateY(30px);transition:opacity .5s,transform .5s}
.screen.on{display:block;opacity:1;transform:translateY(0);animation:screenIn .5s}
.screen.exit{opacity:0;transform:translateY(-30px)}
@keyframes screenIn{from{opacity:0;transform:translateY(40px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.profile-bar{position:fixed;top:10px;right:10px;z-index:100;display:flex;align-items:center;gap:8px;background:rgba(10,10,30,.95);border:1px solid rgba(0,242,254,.4);border-radius:50px;padding:5px 14px 5px 5px;backdrop-filter:blur(15px);cursor:pointer;transition:all .3s;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.profile-bar:hover{border-color:#00f2fe;box-shadow:0 0 25px rgba(0,242,254,.5);transform:translateY(-2px)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ff006e,#8338ec);display:flex;align-items:center;justify-content:center;font-size:1em;font-weight:bold;color:#fff;border:2px solid #00f2fe;flex-shrink:0;overflow:hidden;transition:all .3s}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-info{display:flex;flex-direction:column;min-width:0}
.profile-name{font-size:.8em;font-weight:bold;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-level{font-size:.65em;color:#00f2fe}
.profile-xp-bar{width:70px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:2px;overflow:hidden}
.profile-xp-fill{height:100%;background:linear-gradient(90deg,#00f2fe,#8338ec);transition:width .5s}
.sync-indicator{position:fixed;top:10px;left:10px;z-index:100;padding:6px 12px;background:rgba(10,10,30,.9);border:1px solid rgba(6,255,165,.4);border-radius:20px;font-size:.75em;color:#06ffa5;backdrop-filter:blur(10px);display:flex;align-items:center;gap:6px;cursor:pointer;transition:all .3s}
.sync-indicator:hover{transform:scale(1.05)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#06ffa5;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(15px);z-index:1000;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;padding:15px}
.modal-overlay.on{display:flex;opacity:1}
.modal{background:linear-gradient(135deg,#0f0f2e,#1a1a3e);border:2px solid #4facfe;border-radius:20px;padding:25px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;text-align:center;transform:scale(.7);transition:transform .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 20px 60px rgba(0,0,0,.8)}
.modal-overlay.on .modal{transform:scale(1)}
.modal h3{font-size:1.8em;margin-bottom:12px;background:linear-gradient(90deg,#00f2fe,#ff006e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal p{font-size:1em;color:#ccc;margin-bottom:15px;line-height:1.5}
.modal-btn{padding:12px 30px;background:linear-gradient(135deg,#4facfe,#00f2fe);border:none;color:#fff;border-radius:25px;cursor:pointer;font-size:1em;font-weight:bold;transition:all .3s;box-shadow:0 6px 20px rgba(0,242,254,.4);margin:4px}
.modal-btn:hover{transform:scale(1.05)}
.modal-btn.s{background:linear-gradient(135deg,#ff006e,#8338ec)}
.modal-btn.ghost{background:transparent;border:2px solid #4facfe}
.modal-btn.gold{background:linear-gradient(135deg,#ffbe0b,#ff006e)}
.profile-modal{display:flex;flex-direction:column;gap:15px}
.profile-header{display:flex;align-items:center;gap:15px;padding:15px;background:rgba(0,0,0,.3);border-radius:15px;border:1px solid rgba(0,242,254,.2)}
.profile-avatar-big{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#ff006e,#8338ec);display:flex;align-items:center;justify-content:center;font-size:2em;font-weight:bold;color:#fff;border:3px solid #00f2fe;flex-shrink:0;overflow:hidden;cursor:pointer;transition:all .3s}
.profile-avatar-big:hover{transform:scale(1.1);box-shadow:0 0 25px rgba(0,242,254,.5)}
.profile-avatar-big img{width:100%;height:100%;object-fit:cover}
.profile-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.profile-stat{background:rgba(0,0,0,.3);padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.1);transition:all .3s}
.profile-stat:hover{border-color:#00f2fe;transform:translateY(-2px)}
.profile-stat-n{font-size:1.3em;font-weight:bold;color:#00f2fe}
.profile-stat-l{font-size:.75em;color:#aaa}
.auth-section{padding:15px;background:rgba(0,0,0,.3);border-radius:12px;border:1px dashed rgba(255,255,255,.2)}
.auth-section h4{margin-bottom:8px;color:#ffbe0b;font-size:1em}
.auth-tabs{display:flex;gap:5px;margin-bottom:12px}
.auth-tab{flex:1;padding:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:15px;cursor:pointer;font-size:.85em;transition:all .2s}
.auth-tab.active{background:#4facfe;border-color:#4facfe}
.auth-form{display:flex;flex-direction:column;gap:8px}
.auth-input{padding:10px 14px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);border-radius:12px;color:#fff;font-size:.95em;outline:none;transition:border-color .2s}
.auth-input:focus{border-color:#00f2fe}
.google-btn{width:100%;padding:12px;background:#fff;color:#333;border:none;border-radius:20px;cursor:pointer;font-weight:bold;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .3s;font-size:.95em}
.google-btn:hover{transform:scale(1.02);box-shadow:0 5px 20px rgba(255,255,255,.3)}
.logout-btn{width:100%;padding:10px;background:transparent;color:#ff006e;border:2px solid #ff006e;border-radius:20px;cursor:pointer;font-weight:bold;transition:all .3s;font-size:.9em;margin-top:8px}
.logout-btn:hover{background:#ff006e;color:#fff}
.divider{display:flex;align-items:center;gap:10px;margin:10px 0;color:#888;font-size:.85em}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.2)}
.avatar-picker{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
.avatar-opt{width:45px;height:45px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3em;cursor:pointer;border:2px solid rgba(255,255,255,.2);transition:all .2s;background:rgba(255,255,255,.05)}
.avatar-opt:hover{transform:scale(1.15);border-color:#00f2fe}
.avatar-opt.selected{border-color:#00f2fe;box-shadow:0 0 15px rgba(0,242,254,.5)}
#title{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100vh;padding:15px}
#title.on{display:flex}
.logo{font-size:clamp(3em,10vw,5.5em);font-weight:900;letter-spacing:6px;background:linear-gradient(90deg,#ff006e,#00f2fe,#8338ec,#ffbe0b,#ff006e);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:sh 4s linear infinite,fl 3s ease-in-out infinite;margin-bottom:10px}
.sub{font-size:1.1em;color:#aaa;margin-bottom:40px;letter-spacing:3px}
@keyframes sh{to{background-position:300% center}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.btn-ripple{position:relative;overflow:hidden;transition:all .3s cubic-bezier(.4,0,.2,1)}
.btn-ripple::after{content:'';position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;background:rgba(255,255,255,.5);transform:translate(-50%,-50%);transition:width .6s,height .6s}
.btn-ripple:active::after{width:300px;height:300px}
.btn-ripple:active{transform:scale(.95)}
.play{padding:22px 70px;font-size:1.8em;font-weight:bold;letter-spacing:5px;color:#fff;background:linear-gradient(135deg,#ff006e,#8338ec);border:none;border-radius:50px;cursor:pointer;box-shadow:0 12px 40px rgba(255,0,110,.6);animation:pb 2.5s infinite}
.play:hover{transform:translateY(-4px) scale(1.04)}
@keyframes pb{0%,100%{box-shadow:0 12px 40px rgba(255,0,110,.6)}50%{box-shadow:0 12px 50px rgba(255,0,110,.9),0 0 80px rgba(131,56,236,.5)}}
.stats-row{margin-top:35px;display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.stat{text-align:center;padding:15px 22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:15px;backdrop-filter:blur(10px);transition:all .3s}
.stat:hover{transform:translateY(-4px);border-color:#00f2fe}
.stat-n{font-size:2em;font-weight:bold;color:#00f2fe}
.stat-l{font-size:.8em;color:#aaa;margin-top:5px;letter-spacing:1px}
.mh{text-align:center;margin-bottom:20px}
.mh h2{font-size:2.2em;background:linear-gradient(90deg,#00f2fe,#ff006e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.mh p{color:#888;font-size:.95em}
.menu-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;max-width:700px;margin:0 auto 20px}
.menu-info-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:15px;padding:15px;text-align:center;transition:all .3s}
.menu-info-card:hover{border-color:#00f2fe;transform:translateY(-3px)}
.menu-info-card .mic{font-size:2em;margin-bottom:5px}
.menu-info-card .min{font-size:1.3em;font-weight:bold;color:#00f2fe}
.menu-info-card .mil{font-size:.75em;color:#aaa}
.ma{display:flex;justify-content:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.ab{padding:10px 25px;background:rgba(255,255,255,.08);border:2px solid #00f2fe;color:#fff;border-radius:30px;cursor:pointer;font-size:.95em;font-weight:600;transition:all .3s}
.ab:hover{background:#00f2fe;color:#05050f;transform:translateY(-3px)}
.ab.r{border-color:#ff006e}.ab.r:hover{background:#ff006e}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px;max-width:1100px;margin:0 auto;padding-bottom:30px}
.gc{position:relative;aspect-ratio:1;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);border-radius:20px;cursor:pointer;transition:all .4s cubic-bezier(.34,1.56,.64,1);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px;text-align:center}
.gc::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--c1,#ff006e),var(--c2,#8338ec));opacity:0;transition:opacity .4s;border-radius:18px}
.gc:hover::before{opacity:.35}
.gc:hover{transform:translateY(-10px) scale(1.04);border-color:var(--c1,#ff006e);box-shadow:0 15px 40px rgba(0,0,0,.5),0 0 30px var(--c1,#ff006e)}
.gc>*{position:relative;z-index:1}
.gi{font-size:3em;margin-bottom:8px;filter:drop-shadow(0 0 12px currentColor);transition:transform .4s}
.gc:hover .gi{transform:scale(1.15) rotate(-6deg)}
.gn{font-size:1em;font-weight:bold;margin-bottom:4px}
.gd{font-size:.75em;color:#aaa}
.gs{max-width:720px;margin:0 auto}
.gt{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px}
.bb{padding:9px 18px;background:rgba(255,255,255,.08);border:2px solid #ff006e;color:#fff;border-radius:25px;cursor:pointer;font-size:.9em;font-weight:600;transition:all .3s}
.bb:hover{background:#ff006e;transform:translateX(-4px)}
.gtt{font-size:1.4em;background:linear-gradient(90deg,#00f2fe,#ff006e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:bold}
.stats-btn{padding:7px 15px;background:rgba(255,255,255,.08);border:2px solid #ffbe0b;color:#fff;border-radius:25px;cursor:pointer;font-size:.8em;font-weight:600;transition:all .3s}
.stats-btn:hover{background:#ffbe0b;color:#05050f}
.gc2{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:20px;text-align:center;backdrop-filter:blur(15px)}
canvas.gc{background:#0a0a1e;border:2px solid #4facfe;border-radius:12px;max-width:100%;touch-action:none;display:block;margin:0 auto}
.gi2{display:flex;justify-content:space-around;margin:12px 0;font-size:1.05em;flex-wrap:wrap;gap:10px}
.gi2 span.v{color:#00f2fe;font-weight:bold}
.gb{padding:9px 22px;background:linear-gradient(135deg,#4facfe,#00f2fe);border:none;color:#fff;border-radius:22px;cursor:pointer;margin:4px;font-size:.9em;font-weight:bold;transition:all .3s}
.gb:hover{transform:translateY(-2px) scale(1.04)}
.gb.s{background:linear-gradient(135deg,#ff006e,#8338ec)}
.gh{margin-top:12px;font-size:.8em;color:#888;line-height:1.5}
.tutorial{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(200px);background:rgba(10,10,30,.95);border:2px solid #00f2fe;border-radius:15px;padding:15px 25px;max-width:90%;z-index:999;opacity:0;transition:all .5s cubic-bezier(.34,1.56,.64,1)}
.tutorial.on{transform:translateX(-50%) translateY(0);opacity:1}
.tutorial-icon{font-size:1.8em;margin-bottom:6px}
.tutorial-text{font-size:.9em;color:#fff;line-height:1.4}
.tutorial-close{position:absolute;top:6px;right:10px;background:none;border:none;color:#fff;font-size:1.3em;cursor:pointer;opacity:.6}
.tutorial-close:hover{opacity:1}
.cf{position:fixed;width:10px;height:10px;pointer-events:none;z-index:1001;animation:cf 2.5s ease-in forwards}
@keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.dp{display:none;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:6px;justify-content:center;margin:15px auto}
.dp button{background:rgba(79,172,254,.2);border:2px solid #4facfe;color:#fff;border-radius:12px;font-size:1.6em;cursor:pointer}
.dp button:active{background:#4facfe;transform:scale(.9)}
.dp .u{grid-column:2;grid-row:1}.dp .l{grid-column:1;grid-row:2}.dp .r{grid-column:3;grid-row:2}.dp .d{grid-column:2;grid-row:3}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:15px 0}
.setting-card{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:15px;padding:15px;text-align:left}
.setting-card h5{color:#00f2fe;margin-bottom:8px;font-size:.95em}
.setting-card label{display:block;color:#aaa;font-size:.8em;margin-bottom:5px}
.setting-card select,.setting-card input[type=range]{width:100%;padding:6px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#fff;font-size:.9em}
.theme-options{display:flex;gap:8px;flex-wrap:wrap}
.theme-opt{width:40px;height:40px;border-radius:10px;cursor:pointer;border:2px solid rgba(255,255,255,.2);transition:all .2s}
.theme-opt:hover,.theme-opt.selected{border-color:#00f2fe;transform:scale(1.1)}
.multiplayer-placeholder{text-align:center;padding:40px 20px}
.multiplayer-placeholder .mp-icon{font-size:4em;margin-bottom:15px;animation:fl 2s infinite}
.multiplayer-placeholder h4{font-size:1.5em;color:#ffbe0b;margin-bottom:10px}
.multiplayer-placeholder p{color:#aaa;font-size:.95em;margin-bottom:20px}
.multiplayer-features{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:15px}
.mp-feature{background:rgba(255,255,255,.05);padding:10px;border-radius:10px;font-size:.85em;color:#888}
.mp-feature .mfi{font-size:1.5em;margin-bottom:5px}
@media(max-width:600px){
.dp{display:grid}
.profile-bar{top:8px;right:8px;padding:4px 10px 4px 4px;gap:6px}
.profile-info{display:none}
.avatar{width:30px;height:30px;font-size:.9em}
.gg{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gi{font-size:2.5em}
.logo{letter-spacing:3px}
.mh h2{font-size:1.8em}
.mh{margin-bottom:15px}
.play{padding:18px 55px;font-size:1.5em}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div class="sync-indicator" id="syncInd" onclick="showSettings()"><div class="sync-dot"></div><span id="syncText">💾 Локально</span></div>

<div class="profile-bar btn-ripple" onclick="showProfile()">
<div class="avatar" id="pAvatar">Г</div>
<div class="profile-info">
<div class="profile-name" id="pName">Гость</div>
<div class="profile-level" id="pLevel">Уровень 1</div>
<div class="profile-xp-bar"><div class="profile-xp-fill" id="pXpFill" style="width:0%"></div></div>
</div>
</div>

<div class="modal-overlay" id="modal"><div class="modal" id="modalContent"></div></div>

<div class="tutorial" id="tutorial">
<button class="tutorial-close" onclick="hideTutorial()">×</button>
<div class="tutorial-icon" id="tutIcon"></div>
<div class="tutorial-text" id="tutText"></div>
</div>

<section id="title" class="screen on">

<div class="sub">· 20 ИГР · БЕСКОНЕЧНОЕ ВЕСЕЛЬЕ ·</div>

<div class="stat"><div class="stat-n" id="totalWins">0</div><div class="stat-l">ПОБЕД</div></div>
</div>
</section>

<section id="menu" class="screen">
<div class="mh"><h2>Выбери игру</h2><p>или доверься случайности</p></div>
<div class="menu-info">
<div class="menu-info-card"><div class="mic">🎮</div><div class="min" id="miGames">0</div><div class="mil">Игр сыграно</div></div>
<div class="menu-info-card"><div class="mic">🏆</div><div class="min" id="miWins">0</div><div class="mil">Побед</div></div>
<div class="menu-info-card"><div class="mic">⭐</div><div class="min" id="miLevel">1</div><div class="mil">Уровень</div></div>
<div class="menu-info-card"><div class="mic">🔥</div><div class="min" id="miStreak">0</div><div class="mil">Серия</div></div>
</div>
<div class="ma">
<button class="ab r btn-ripple" onclick="rand()">🎲 Случайная</button>
<button class="ab btn-ripple" onclick="showMultiplayer()">👥 Мультиплеер</button>
<button class="ab btn-ripple" onclick="showSettings()">⚙️ Настройки</button>
<button class="ab btn-ripple" onclick="go('title')">← На главную</button>
</div>
<div class="gg" id="grid"></div>
</section>

<section id="game" class="screen">
<div class="gs">
<div class="gt">
<button class="bb btn-ripple" onclick="back()">← Меню</button>
<div class="gtt" id="gtitle">Игра</div>
<button class="stats-btn btn-ripple" onclick="showGameStats()">📊</button>
</div>
<div class="gc2" id="gcont"></div>
</div>
</section>

if(useFirebase){
  onAuthStateChanged(auth,async(user)=>{
    console.log('🔔 Auth:',user?user.email:'null');
    if(user){
      currentUser=user;
      if(unsubscribe)unsubscribe();
      const ref=doc(db,'users',user.uid);
      try{
        const snap=await getDoc(ref);
        if(!snap.exists()){
          console.log('⚠️ Создаём профиль...');
          await setDoc(ref,{
            name:user.displayName||user.email.split('@')[0],
            photo:user.photoURL||'',
            avatar:user.photoURL?'img':'👤',
            avatarType:user.photoURL?'img':'emoji',
            xp:localProfile.xp||0,level:localProfile.level||1,

            bestStreak:localProfile.bestStreak||0,timePlayed:localProfile.timePlayed||0,
            achievements:localProfile.achievements||[],joined:localProfile.joined||Date.now()
          });
        }
        const data=(await getDoc(ref)).data();
        if(data.gameStats)localStats=data.gameStats;
        localProfile={...localProfile,...data};
        updateProfileUI();
        updateMenuInfo();
        console.log('✅ Профиль загружен');
        unsubscribe=onSnapshot(ref,(d)=>{
          if(d.exists()){
            const dt=d.data();
            if(dt.gameStats)localStats=dt.gameStats;
            localProfile={...localProfile,...dt};
            updateProfileUI();
            updateMenuInfo();
            // Если модалка профиля открыта — обновить её
            const modal=document.getElementById('modal');
            if(modal.classList.contains('on')){

          }

    }else{

      if(unsubscribe){unsubscribe();unsubscribe=null}
      localProfile=JSON.parse(localStorage.getItem('profile')||'{"name":"Гость","xp":0,"level":1,"gamesPlayed":0,"wins":0,"losses":0,"totalScore":0,"bestStreak":0,"timePlayed":0,"achievements":[],"joined":'+Date.now()+',"avatar":"Г","avatarType":"letter","theme":"neon"}');

function defaultStats(){return{played:0,wins:0,losses:0,bestScore:0,totalScore:0,avgScore:0,bestTime:0,worstTime:999999,totalTime:0,currentStreak:0,bestStreak:0,perfectGames:0,failedAttempts:0,accuracy:0,clicks:0,misses:0,levelsCompleted:0,highestLevel:0,itemsCollected:0,enemiesDefeated:0,damageTaken:0,healsUsed:0,powerupsUsed:0,secretsFound:0}}

window.getGameStats=(id)=>{
  if(useFirebase&&currentUser)return localStats[id]||defaultStats();
  return JSON.parse(localStorage.getItem('stats_'+id)||JSON.stringify(defaultStats()));
};

window.saveGameStats=async(id,stats)=>{
  if(useFirebase&&currentUser){
    localStats[id]=stats;
    try{await updateDoc(doc(db,'users',currentUser.uid),{['gameStats.'+id]:stats})}catch(e){}
  }else{localStorage.setItem('stats_'+id,JSON.stringify(stats))}
};

window.updateGameStats=async(id,update)=>{
  const stats=window.getGameStats(id);
  Object.keys(update).forEach(k=>{
    if(k==='bestScore')stats.bestScore=Math.max(stats.bestScore,update[k]);
    else if(k==='bestTime')stats.bestTime=update[k]<stats.bestTime?update[k]:stats.bestTime;
    else if(k==='worstTime')stats.worstTime=update[k]>stats.worstTime?update[k]:stats.worstTime;
    else if(k==='currentStreak'){stats.currentStreak=update[k];stats.bestStreak=Math.max(stats.bestStreak,update[k])}
    else if(typeof stats[k]==='number')stats[k]+=update[k];
  });
  stats.avgScore=stats.played?Math.round(stats.totalScore/stats.played):0;
  stats.accuracy=stats.clicks?Math.round(stats.clicks/(stats.clicks+stats.misses)*100):0;
  await window.saveGameStats(id,stats);
};

    container.textContent=profile.avatar||'👤';
    container.style.fontSize=size?parseInt(size)*0.6+'px':'2em';
  }else{
    container.textContent=(profile.avatar||profile.name||'Г')[0].toUpperCase();
  }
}
